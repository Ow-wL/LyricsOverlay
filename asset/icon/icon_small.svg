<?xml version="1.0" encoding="UTF-8"?>
<!-- LyricsOverlay 앱 아이콘 16~24px용 간소화 버전: 줄을 두 개로 줄이고 두껍게. 16px 격자에 맞춘 좌표. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14172F"/>
      <stop offset="1" stop-color="#262153"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="url(#tile)"/>
  <rect x="2.5" y="4.5" width="7" height="2" rx="1" fill="#5E5A9E"/>
  <rect x="2.5" y="8.5" width="9" height="2" rx="1" fill="#9E90FD"/>
  <g fill="#FDFDFD">
    <circle cx="11.6" cy="9.6" r="1.75"/>
    <rect x="12.45" y="3.4" width="1.2" height="6.2"/>
    <path d="M 12.45 3.5 C 13.6 3.9 15.1 4.5 14.9 6.4 C 14.6 5.6 13.7 5.3 13.65 5.3 Z"/>
  </g>
</svg>
